plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dev.ministudio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dev.ministudio'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/DEPENDENCIES',
                '/META-INF/NOTICE',
                '/META-INF/LICENSE',
                '/META-INF/LICENSE.txt',
                '/META-INF/NOTICE.txt',
                '/META-INF/INDEX.LIST',
                '/META-INF/*.kotlin_module'
            ]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion('2.0.21')
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Networking & Utils
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'org.json:json:20240303'

    // Sora Editor 0.24.6
    def soraVersion = '0.24.6'
    implementation "io.github.rosemoe:editor:$soraVersion"
    implementation "io.github.rosemoe:language-java:$soraVersion"
    implementation "io.github.rosemoe:language-textmate:$soraVersion"

    // FAB (legacy)
    implementation 'com.getbase:floatingactionbutton:1.10.1'

    // AndroidX & Material 3
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'

    // JGit + SSH
    implementation('org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'org.slf4j:slf4j-nop:2.0.16'
    implementation 'com.jcraft:jsch:0.1.55'

    // Kotlin stdlib
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.eclipse.jdt:ecj:3.37.0'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    
}
