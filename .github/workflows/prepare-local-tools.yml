name: Prepare Local Build Tools

on:
  workflow_dispatch:   # กดรันมือในแท็บ Actions
  push:
    paths:
      - '.github/workflows/prepare-local-tools.yml'

permissions:
  contents: write

jobs:
  pack-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download tools (jar)
        run: |
          mkdir -p tools_out
          cd tools_out

          # ECJ (Eclipse Java Compiler)
          curl -L -o ecj.jar \
            "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar"

          # D8 / R8 (มีคลาส d8)
          curl -L -o d8.jar \
            "https://dl.google.com/android/maven2/com/android/tools/r8/8.7.18/r8-8.7.18.jar"

          # ดึง android.jar จาก Android SDK (API 34)
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -L -o cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34"
          cp "$ANDROID_HOME/platforms/android-34/android.jar" ./android.jar

          # ไฟล์อธิบายเวอร์ชัน
          cat > VERSION.txt << EOF
          ecj=3.37.0
          d8/r8=8.7.18
          android.jar=API 34
          packed=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          ls -lh
          zip -r ../local-build-tools.zip .
          cd ..
          ls -lh local-build-tools.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: local-tools-v1
          name: Local Build Tools v1
          body: |
            ชุดเครื่องมือสำหรับ Local Build บนมือถือ
            - ecj.jar
            - d8.jar (r8)
            - android.jar (API 34)
          files: local-build-tools.zip
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}